<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>设置 API Key</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 18px 18px 14px;
    font: 13px/1.6 -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 14px; margin: 0 0 10px; font-weight: 650; }
  p.hint { margin: 0 0 12px; font-size: 11.5px; opacity: .62; line-height: 1.5; }
  input {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 9px;
    border: 1px solid rgba(128, 148, 180, .38); background: transparent; color: inherit;
    font: inherit; outline: none;
  }
  input:focus { border-color: #3b7bd4; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    flex: 1; padding: 8px 0; border-radius: 9px; cursor: pointer; font: inherit;
    border: 1px solid rgba(128, 148, 180, .38); background: transparent; color: inherit;
  }
  button.main { background: #3b7bd4; border-color: #3b7bd4; color: #fff; font-weight: 600; }
  #msg { margin-top: 9px; font-size: 11.5px; min-height: 16px; opacity: .7; }
</style>
</head>
<body>
<h1>DeepSeek API Key</h1>
<p class="hint">填了才能报余额（右键她）。Key 只存在本机 <code>%APPDATA%\dsh-pet-whale-app\config.json</code>，不会外传。</p>
<input id="k" type="password" placeholder="sk-..." spellcheck="false" autofocus />
<div class="row">
  <button id="save" class="main">保存</button>
  <button id="cancel">取消</button>
</div>
<div id="msg"></div>
<script>
  const 输入 = document.getElementById('k')
  const 提示 = document.getElementById('msg')
  ;(async () => {
    try {
      const k = await window.petApp.取Key()
      if (k) 输入.value = k
    } catch (e) {}
    输入.focus()
  })()

  async function 保存() {
    const v = 输入.value.trim()
    const r = await window.petApp.设Key(v)
    提示.textContent = r && r.has ? '已保存。' : '清空了（不填就报不出余额）。'
    setTimeout(() => window.petApp.关Key窗(), 600)
  }

  document.getElementById('save').addEventListener('click', 保存)
  document.getElementById('cancel').addEventListener('click', () => window.petApp.关Key窗())
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') 保存()
    if (e.key === 'Escape') window.petApp.关Key窗()
  })
</script>
</body>
</html>
